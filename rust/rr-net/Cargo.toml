[package]
name = "rr-net"
version = "0.1.0"
edition = "2021"
description = "Room networking shared by the Metallic-RC client and server: the RR packet layer and a LiteNetLib 1.x compatible transport"
publish = false

[dependencies]
twox-hash = "2"
# Kiwii realtime net handshake (rr_net::kiwii): clean X25519 ECDH → SHA256 → Rabbit key (matches the realtime server).
x25519-dalek = { version = "2.0.1", features = ["getrandom"] }
sha2 = "0.10.8"
rand = "0.8.5"
