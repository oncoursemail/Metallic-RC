[workspace]
resolver = "2"
members = ["metallic-rc-server", "unity-assets", "metallic-rc-client", "rr-net", "circuits", "gamemodes"]

[profile.release]
lto = "thin"

# Bevy and the asset decoders are slow unoptimised; the client's own code stays quick to rebuild
[profile.dev.package."*"]
opt-level = 2

# Day-to-day builds (`--profile fast`): optimised like release, but incremental and without LTO, so a change to our
# own code relinks in seconds instead of minutes. Release stays the profile for shipped builds and timing runs.
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
