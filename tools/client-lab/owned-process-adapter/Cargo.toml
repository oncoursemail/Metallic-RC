[package]
name = "metallic-owned-process-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO"] }

[[bin]]
name = "metallic-owned-adapter-check"
path = "src/check.rs"

[[bin]]
name = "metallic-owned-adapter-worker"
path = "src/worker.rs"
