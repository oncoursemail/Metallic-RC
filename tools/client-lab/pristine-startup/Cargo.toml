[package]
name = "metallic-pristine-startup"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
metallic-external-guard-fixture = { path = "../external-guard-fixture" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Rpc", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[[bin]]
name = "metallic-pristine-startup"
path = "src/main.rs"

[[bin]]
name = "metallic-pristine-guard"
path = "src/guard_main.rs"
