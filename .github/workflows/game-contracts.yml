name: Metallic game contract prototypes

on:
  pull_request:
    paths:
      - "game/**"
      - "services/support/**"
      - ".github/workflows/game-contracts.yml"
  push:
    paths:
      - "game/**"
      - "services/support/**"
      - ".github/workflows/game-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test future gameplay contracts
        working-directory: game
        run: npm test
      - name: Test support case contracts
        working-directory: services/support
        run: npm test
