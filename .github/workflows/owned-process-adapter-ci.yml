name: Authored-worker process adapter

on:
  pull_request:
    paths:
      - 'tools/client-lab/owned-process-adapter/**'
      - '.github/workflows/owned-process-adapter-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/client-lab/owned-process-adapter/**'
      - '.github/workflows/owned-process-adapter-ci.yml'

permissions:
  contents: read

concurrency:
  group: owned-process-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Fixed authored worker (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/client-lab/owned-process-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build locked authored binaries
        run: cargo build --locked --release --bins
      - name: Test pure pin, environment and closed-role rules
        run: cargo test --locked --lib
      - name: Check inert plan without spawning a worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checker = if ($IsWindows) { './target/release/metallic-owned-adapter-check.exe' } else { './target/release/metallic-owned-adapter-check' }
          $plan = & $checker --plan
          if ($LASTEXITCODE -ne 0) { throw 'Inert plan failed.' }
          $expected = '{"gameWillNotRun":true,"executionReady":false,"target":"fixed_authored_sibling_worker_only"}'
          if ($plan -cne $expected) { throw 'Unexpected inert plan.' }
      - name: Verify Windows token refusal or nine standard-user controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # This digest identifies this CI build; it is not independent attestation.
          $workerPin = (Get-FileHash './target/release/metallic-owned-adapter-worker.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = & './target/release/metallic-owned-adapter-check.exe' --self-test $workerPin 2>&1
          $code = $LASTEXITCODE
          try {
            $result = ($lines | ForEach-Object { $_.ToString() }) -join "`n" | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Owned-check receipt parse failed (exit=$code)."
          }
          $safeError = 'unavailable'
          if ($result.error -is [string] -and $result.error -cmatch '\A[a-z][a-z0-9_]{0,79}\z') { $safeError = $result.error }
          if ($result.originalClientTested -isnot [bool] -or $result.originalClientTested -ne $false -or
              $result.executionReady -isnot [bool] -or $result.executionReady -ne $false -or $result.ok -isnot [bool]) {
            throw "Unexpected owned-check receipt types (exit=$code; error=$safeError)."
          }
          $names = @($result.PSObject.Properties.Name | Sort-Object) -join ','
          if ($code -eq 1 -and $result.ok -eq $false -and $result.error -is [string] -and $result.error -ceq 'non_admin_fixture_required' -and
              $names -ceq 'error,executionReady,ok,originalClientTested') {
            Write-Output 'PASS: actual elevated-token gate refused before worker creation; nine standard-user controls did not run here.'
          } elseif ($code -eq 0 -and $result.ok -eq $true -and ($result.checks -is [int] -or $result.checks -is [long]) -and $result.checks -eq 9 -and
                    $result.scope -is [string] -and $result.scope -ceq 'authored_sibling_worker_only' -and
                    $names -ceq 'checks,executionReady,ok,originalClientTested,scope') {
            Write-Output 'PASS: nine authored-worker controls under the actual standard-user token.'
          } else {
            throw "Owned-worker controls failed (exit=$code; error=$safeError)."
          }
