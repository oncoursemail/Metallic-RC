name: Metallic visual quality gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'tests/browser/**'
      - '.github/workflows/site-visual.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'tests/browser/**'
      - '.github/workflows/site-visual.yml'
  workflow_dispatch:
    inputs:
      upload_screenshots:
        description: 'Upload the rendered review images (uses Actions artifact storage)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  site-render:
    name: Real Chromium site rendering + screenshot review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright package
        run: npm install --prefix tests/browser --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Install Chromium for test
        run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Serve checked-out Metallic website on loopback and inspect real layouts
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/metallic-site-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          node tests/browser/verify_site.mjs
      - name: Summarize generated review images
        id: review_output
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path('artifacts/ui-screenshots')
          if root.is_symlink():
              raise SystemExit('Review output directory must not be a symlink')
          files = []
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('Review output must not contain symlinks')
              if path.is_file():
                  files.append(path)
          total = sum(p.stat().st_size for p in files)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### Visual review output\nGenerated {len(files)} files ({total:,} bytes).\n\n')
              summary.write('Layout and browser assertions run on every applicable PR and push. Screenshot upload is an explicit manual-run option.\n')
          if total > 10 * 1024 * 1024:
              raise SystemExit('Review output exceeds the 10 MiB screenshot budget')
          PY
      - name: Upload requested desktop and mobile screenshots
        if: ${{ always() && steps.review_output.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.upload_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: metallic-site-screenshots
          path: artifacts/ui-screenshots/
          retention-days: 3
          if-no-files-found: error

