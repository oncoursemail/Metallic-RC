name: Launcher component checks
on:
  pull_request:
    paths:
      - 'services/launcher/**'
      - '.github/workflows/launcher-checks.yml'
  push:
    paths:
      - 'services/launcher/**'
      - '.github/workflows/launcher-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/launcher/tests/*.test.mjs
