name: Update project progress

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  push:
    branches: [main]
    paths:
      - 'scripts/update_progress.py'
      - 'scripts/render_progress_svg.py'
      - 'docs/DESIGN_SYSTEM.md'
      - 'docs/site/**'
      - 'services/discord-bot/**'
      - 'tests/test_progress.py'
      - 'tests/test_progress_svg.py'
      - 'tests/test_load_harness.py'
      - 'tests/test_site.py'
      - 'tests/load/**'
      - 'docs/ROADMAP.md'
      - '.github/workflows/update-progress.yml'
      - 'README.md'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: metallic-issue-progress
  cancel-in-progress: false

jobs:
  update-progress:
    name: Validate and refresh GitHub issue progress
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate website JavaScript syntax
        run: |
          node --check docs/site/app.js
          node --check services/discord-bot/src/index.mjs
          node --check services/discord-bot/src/register.mjs
          node --test services/discord-bot/tests/*.test.mjs
      - name: Rebuild docs/PROGRESS.md and docs/progress.json from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python scripts/update_progress.py
      - name: Refresh and commit safely when concurrent issues change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          git config user.name "metallic-roadmap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other workflow runs and contributors may push at the same moment.
          # Start from the remote tip on every attempt, fetch *fresh* issue state,
          # then push a clean commit. Only the generated dashboard files change.
          for attempt in 1 2 3 4 5; do
            echo "Dashboard publication attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_progress.py
            git add docs/PROGRESS.md docs/progress.json docs/progress.svg
            if git diff --cached --quiet; then
              echo "Roadmap snapshot is unchanged."
              exit 0
            fi
            git commit -m "chore(roadmap): refresh issue progress [skip ci]"
            if git push origin HEAD:main; then
              echo "Roadmap snapshot published safely."
              exit 0
            fi
            echo "Remote advanced during progress refresh, retrying against fresh issue snapshot..."
            sleep "${attempt}"
          done
          echo "Unable to update roadmap after 5 attempts; will reconcile on the next issue event or scheduled run." >&2
          exit 1
